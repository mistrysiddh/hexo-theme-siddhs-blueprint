# ---------- Comments ----------
# local:   session-local demo box, no backend, no setup (default)
# giscus:  real, persisted comments backed by GitHub Discussions — free, no
#          server to run. Set up in ~2 minutes at https://giscus.app: enable
#          Discussions on a PUBLIC repo, install the giscus GitHub App on it,
#          then paste the four values giscus.app generates for you below.
# disabled: hide the comments section entirely
comments:
  provider: local
  giscus:
    repo: ""              # "username/repo"
    repo_id: ""
    category: "Announcements"
    category_id: ""
    mapping: "pathname"   # maps each post's URL to its own Discussion thread
    reactions_enabled: true
    input_position: "top"

# ---------- Newsletter ----------
# provider options:
# local: cosmetic demo only — no email is sent or stored anywhere (default)
# listmonk: wires the subscribe form to a real, self-hosted, open-source
#           listmonk (https://listmonk.app) instance. Requires listmonk to be
#           deployed somewhere reachable from your visitors' browsers and a
#           public mailing list created in it — see the README's "Newsletter"
#           section for the full self-hosting + CORS setup guide.
newsletter:
  provider: local
  listmonk:
    url: ""          # e.g. "https://list.yourdomain.com" — your listmonk instance
    list_uuid: ""     # the public list's UUID, from listmonk → Lists

